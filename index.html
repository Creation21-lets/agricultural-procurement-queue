<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fasal Token: digital procurement queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5FAF0; --paper:#FFFFFF; --ink:#1F2D24; --muted:#586B5D; --line:#DDE9D4;
  --primary:#2E7D4F; --primary-ink:#FFFFFF; --primary-soft:#E4F4DC;
  --leaf:#63B06A; --wheat:#F4B942; --wheat-ink:#4A3410; --soil:#6F4E2F;
  --sky:#D8EEF7; --sky-ink:#1D5A74; --sky-line:#5AAED0;
  --danger:#C2432F; --danger-soft:#FBE3DD; --focus:#1D6FB8;
  --hero-top:#D3EBF6; --hero-mid:#EDF8E3; --hero-bot:#FFF3CD; --hero-ink:#173B27; --hero-soft:#44624F;
  --tok-a:#FFF4D2; --tok-b:#E4F4DC; --band-a:#E4F4DC; --band-b:#FFF0C4;
  --c-book-bg:#FFEFBE; --c-book-ink:#6B4B08;
  --c-wait-bg:#DCEFF8; --c-wait-ink:#1E5670;
  --c-ok-bg:#DDF2D6; --c-ok-ink:#1E6A36;
  --c-done-bg:#2E7D4F; --c-done-ink:#FFFFFF;
  --c-bad-bg:#FBE3DD; --c-bad-ink:#9B2F1E;
  --c-mute-bg:#ECEFE6; --c-mute-ink:#5C6558;
  --shadow:0 1px 2px rgba(40,60,40,.08),0 8px 22px rgba(40,60,40,.07);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --body:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101A14; --paper:#17241B; --ink:#EAF0E2; --muted:#A5B3A0; --line:#2B3C2F;
    --primary:#5FB06E; --primary-ink:#0B1A0F; --primary-soft:#1F3425;
    --leaf:#6CC07B; --wheat:#EDBB52; --wheat-ink:#2E2012; --soil:#2A3A2E;
    --sky:#16313C; --sky-ink:#A9DAEE; --sky-line:#3F8BAA;
    --danger:#E58375; --danger-soft:#3A1F1B; --focus:#8AB4F8;
    --hero-top:#14303B; --hero-mid:#17301F; --hero-bot:#2B2A16; --hero-ink:#EEF3E4; --hero-soft:#B3C7AE;
    --tok-a:#2B2813; --tok-b:#1B2E20; --band-a:#1B2E20; --band-b:#2B2813;
    --c-book-bg:#3A3115; --c-book-ink:#F0D68A;
    --c-wait-bg:#16313C; --c-wait-ink:#A9DAEE;
    --c-ok-bg:#1D3322; --c-ok-ink:#A9DDB1;
    --c-done-bg:#2F6B3C; --c-done-ink:#FFFFFF;
    --c-bad-bg:#3A1F1B; --c-bad-ink:#F2B3A8;
    --c-mute-bg:#242E26; --c-mute-ink:#B3BCA8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101A14; --paper:#17241B; --ink:#EAF0E2; --muted:#A5B3A0; --line:#2B3C2F;
  --primary:#5FB06E; --primary-ink:#0B1A0F; --primary-soft:#1F3425;
  --leaf:#6CC07B; --wheat:#EDBB52; --wheat-ink:#2E2012; --soil:#2A3A2E;
  --sky:#16313C; --sky-ink:#A9DAEE; --sky-line:#3F8BAA;
  --danger:#E58375; --danger-soft:#3A1F1B; --focus:#8AB4F8;
  --hero-top:#14303B; --hero-mid:#17301F; --hero-bot:#2B2A16; --hero-ink:#EEF3E4; --hero-soft:#B3C7AE;
  --tok-a:#2B2813; --tok-b:#1B2E20; --band-a:#1B2E20; --band-b:#2B2813;
  --c-book-bg:#3A3115; --c-book-ink:#F0D68A;
  --c-wait-bg:#16313C; --c-wait-ink:#A9DAEE;
  --c-ok-bg:#1D3322; --c-ok-ink:#A9DDB1;
  --c-done-bg:#2F6B3C; --c-done-ink:#FFFFFF;
  --c-bad-bg:#3A1F1B; --c-bad-ink:#F2B3A8;
  --c-mute-bg:#242E26; --c-mute-ink:#B3BCA8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
#app{flex:1;display:flex;flex-direction:column}
#app>main{flex:1}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5.2vw,3.7rem);font-weight:800}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800}
h3{font-size:1.25rem;font-weight:700}
h4{font-size:1.02rem;font-weight:700}
p{margin:0 0 .8em}
.muted{color:var(--muted)} .sm{font-size:.875rem} .xs{font-size:.8rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font-family:inherit}
[hidden]{display:none!important}

/* buttons */
.btn{font:600 15px/1 var(--body);min-height:44px;padding:0 18px;border-radius:8px;border:1.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .2s,transform .2s,box-shadow .2s,filter .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(40,60,40,.14)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-gold{background:var(--wheat);color:var(--wheat-ink)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--primary-soft)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.btn-lg{min-height:52px;padding:0 24px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--primary);background:none;border:0;cursor:pointer;padding:0}
.pubnav{margin-left:auto;display:flex;gap:4px;align-items:center}
.pubnav a{padding:10px 12px;color:var(--ink);text-decoration:none;font-weight:500;border-radius:8px;cursor:pointer}
.pubnav a:hover{background:var(--primary-soft)}
.who{margin-left:auto;display:flex;flex-direction:column;line-height:1.2;text-align:right}
.who-name{font-weight:600;font-size:.92rem}
.who-role{font-size:.78rem;color:var(--muted)}
.select-sm,.input,.select,.textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;min-height:44px;padding:0 12px;width:100%}
.select-sm{min-height:36px;width:auto;font-size:.9rem}
.textarea{padding:10px 12px;min-height:84px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);outline:2px solid var(--focus);outline-offset:0}
label.f{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.field{margin-bottom:16px}
.hint{font-size:.82rem;color:var(--muted);margin-top:5px}

/* hero */
.hero{position:relative;overflow:hidden;color:var(--hero-ink);background:linear-gradient(180deg,var(--hero-top) 0%,var(--hero-mid) 58%,var(--hero-bot) 100%)}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:190px}
.hero h1{max-width:15ch;color:var(--hero-ink)}
.hero p.lead{font-size:1.15rem;max-width:52ch;color:var(--hero-soft);margin:22px 0 30px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.cta-row .btn-ghost{border-color:var(--primary);color:var(--primary);background:rgba(255,255,255,.55)}
.ticket-wrap{display:flex;justify-content:center}
.ticket{width:min(340px,100%);background:#FFFEF8;color:#2A2118;border-radius:14px;position:relative;transform:rotate(2.2deg);box-shadow:0 18px 40px rgba(40,80,50,.22);padding:22px 24px 20px}
.ticket::before,.ticket::after{content:"";position:absolute;top:61%;width:26px;height:26px;border-radius:50%;background:var(--hero-mid)}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.t-centre{font-weight:600;font-size:.9rem}
.t-when{font-size:.84rem;color:#6B6556}
.t-token{font-family:var(--display);font-weight:800;font-size:3.6rem;letter-spacing:.02em;color:#2E7D4F;line-height:1;margin:16px 0 6px;font-variant-numeric:tabular-nums}
.t-crop{font-weight:500}
.t-perf{border-top:2px dashed #CFC9AB;margin:20px -4px 16px}
.t-queue{display:flex;align-items:center;gap:14px}
.t-ahead{font-family:var(--display);font-weight:800;font-size:2.4rem;min-width:2.1ch;text-align:center;color:#4A3410;line-height:1;display:inline-block}
.t-ahead.tick{animation:tick .45s cubic-bezier(.34,1.7,.64,1)}
.t-dots{display:flex;gap:8px;margin-top:14px;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;background:#E6E1C8;transition:background .5s,transform .4s cubic-bezier(.34,1.7,.64,1)}
.dot.on{background:#F4B942;transform:scale(1.12)}
.you{margin-left:4px;background:#2E7D4F;color:#fff;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:99px}

/* sky, sun, clouds, field */
.sun{position:absolute;z-index:1;right:5%;top:26px;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#FFF1B0,#F6BE3C);box-shadow:0 0 0 14px rgba(246,190,60,.18),0 0 80px 26px rgba(246,190,60,.32);animation:sunrise 2.2s cubic-bezier(.2,.8,.2,1) both,glow 7s ease-in-out 2.2s infinite alternate}
.cloud{position:absolute;z-index:1;height:30px;width:110px;background:#fff;border-radius:99px;opacity:.92;left:-160px;animation:drift 80s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;left:16px;top:-24px}.cloud::after{width:36px;height:36px;left:56px;top:-16px}
.cloud.c1{top:16%;animation-delay:-24s}
.cloud.c2{top:34%;transform:scale(.7);animation-duration:110s;animation-delay:-70s;opacity:.8}
.field{position:absolute;z-index:1;left:0;right:0;bottom:0;width:100%;height:clamp(110px,22vw,220px);pointer-events:none}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.8s ease-in-out infinite alternate}

/* welcome screen */
.intro{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;text-align:center;padding:56px 20px 190px;background:linear-gradient(180deg,var(--hero-top) 0%,var(--hero-mid) 62%,var(--hero-bot) 100%);color:var(--hero-ink)}
.intro .sun{width:120px;height:120px;right:12%;top:12%}
.intro .field{height:clamp(150px,30vw,300px)}
.intro-body{position:relative;z-index:2;max-width:640px}
.intro-logo{display:inline-block;filter:drop-shadow(0 8px 14px rgba(30,80,50,.25))}
.intro h1{font-size:clamp(3rem,10vw,5.8rem);margin:14px 0 12px;color:var(--hero-ink)}
.intro .tag{font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--hero-soft);margin:0 auto 30px;max-width:30ch}
.visit{min-width:190px;font-size:1.15rem;position:relative}
.visit::after{content:"";position:absolute;inset:-3px;border-radius:11px;border:2px solid var(--primary);animation:ring 2.6s ease-out 2s infinite;pointer-events:none}
.intro .hint2{margin:18px 0 0;font-size:.9rem;color:var(--hero-soft)}
.pi{animation:popin .8s cubic-bezier(.34,1.45,.64,1) both;animation-delay:var(--d,0s)}

/* visit transition */
#transit{position:fixed;inset:0;z-index:100;overflow:hidden}
.tr-wipe{position:absolute;inset:0;clip-path:circle(0 at var(--x) var(--y))}
.tr-wipe.w1{background:var(--wheat)}
.tr-wipe.w2{background:linear-gradient(180deg,var(--hero-top),var(--hero-mid) 60%,var(--hero-bot))}
#transit.run .w1{animation:wipe .8s cubic-bezier(.65,0,.35,1) forwards}
#transit.run .w2{animation:wipe .8s cubic-bezier(.65,0,.35,1) .16s forwards}
.tr-ticket{position:absolute;left:50%;top:50%;width:min(280px,86%);margin-left:calc(min(280px,86%) / -2);margin-top:-110px;background:#FFFEF8;color:#2A2118;border-radius:16px;padding:22px 24px;text-align:center;box-shadow:0 24px 50px rgba(40,80,50,.3);opacity:0;transform:scale(0)}
.tr-ticket::before,.tr-ticket::after{content:"";position:absolute;top:56%;width:24px;height:24px;border-radius:50%;background:var(--hero-mid)}
.tr-ticket::before{left:-12px}.tr-ticket::after{right:-12px}
.tr-ticket .tk{font:800 2.8rem/1 var(--display);color:#2E7D4F;letter-spacing:.02em;margin:8px 0 4px}
.tr-ticket .perf{border-top:2px dashed #CFC9AB;margin:14px -4px 12px}
#transit.run .tr-ticket{animation:tpop .65s cubic-bezier(.34,1.56,.64,1) .6s forwards}
#transit.out{animation:tout .65s ease forwards}
#transit.out .tr-ticket{animation:tfly .65s cubic-bezier(.5,0,.75,0) forwards}

/* sections */
.section{padding:72px 0}
.section.alt{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{max-width:640px;margin-bottom:36px}
.sec-head p{color:var(--muted);margin-top:12px;font-size:1.05rem}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.compare>div{padding:28px}
.compare>div:first-child{background:var(--c-wait-bg);color:var(--c-wait-ink)}
.compare>div:last-child{background:var(--primary-soft)}
.compare ul{margin:14px 0 0;padding-left:20px}.compare li{margin-bottom:8px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;counter-reset:s}
.steps li{position:relative;padding-top:56px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font:800 1.1rem var(--display);display:grid;place-items:center;z-index:1}
.steps li::after{content:"";position:absolute;top:19px;left:46px;right:-18px;border-top:2px dashed var(--sky-line);transform-origin:left center}
.steps li:last-child::after{display:none}
.steps h4{margin-bottom:6px}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.role{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--leaf);border-radius:10px;padding:22px;display:flex;flex-direction:column}
.role.r-staff{border-top-color:var(--wheat)}.role.r-inspector{border-top-color:var(--sky-line)}.role.r-admin{border-top-color:var(--primary)}
.role ul{padding-left:18px;margin:14px 0 20px;flex:1}.role li{margin-bottom:7px;font-size:.95rem}
.centres{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.cc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.cc .big{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--primary)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.meter>span{display:block;height:100%;width:var(--w,0%);background:var(--leaf);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.meter.hot>span{background:var(--wheat)}
.band{background:linear-gradient(100deg,var(--band-a),var(--band-b));color:var(--ink);padding:56px 0;border-top:1px solid var(--line)}
.band .wrap{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer.foot{padding:28px 0;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

/* login */
.login{display:grid;grid-template-columns:.9fr 1.1fr;gap:32px;padding-top:48px;padding-bottom:64px;align-items:start}
.rolelist{display:grid;gap:10px;margin-top:22px}
.roleopt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.roleopt span{color:var(--muted);font-size:.88rem}
.roleopt.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 4px 0 0 var(--primary)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:var(--shadow)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* portal */
.portal{padding-top:26px;padding-bottom:64px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:24px}
.tab{background:none;border:0;padding:12px 16px;font-weight:600;font-size:.96rem;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab.on{color:var(--primary);border-bottom-color:var(--wheat)}
.tab-n{background:var(--c-book-bg);color:var(--c-book-ink);border-radius:99px;font-size:.75rem;padding:1px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi-v{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.1;color:var(--primary)}
.kpi-l{font-size:.85rem;color:var(--muted);margin-top:2px}
.kpi-s{font-size:.78rem;color:var(--muted)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stack{display:grid;gap:20px}
.card h3{margin-bottom:12px}
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.82rem;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--primary);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip-info{background:var(--c-book-bg);color:var(--c-book-ink)}
.chip-wait{background:var(--c-wait-bg);color:var(--c-wait-ink)}
.chip-ok{background:var(--c-ok-bg);color:var(--c-ok-ink)}
.chip-done{background:var(--c-done-bg);color:var(--c-done-ink)}
.chip-bad{background:var(--c-bad-bg);color:var(--c-bad-ink)}
.chip-mute{background:var(--c-mute-bg);color:var(--c-mute-ink)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar .input,.toolbar .select{width:auto;min-width:180px}

/* token card */
.tokcard{background:linear-gradient(135deg,var(--tok-a),var(--tok-b));color:var(--ink);border:1px solid var(--line);border-left:8px solid var(--wheat);border-radius:12px;padding:22px 24px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tokcard .tk{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--primary)}
.tokcard .sub{color:var(--muted);font-size:.92rem}

.hbars{display:grid;gap:10px}

/* motion */
@keyframes popin{from{opacity:0;transform:scale(.88) translateY(14px)}to{opacity:1;transform:none}}

#app.animate .hero .pi{animation:popin .8s cubic-bezier(.34,1.45,.64,1) both;animation-delay:var(--d,0s)}

#app.animate .kpis .kpi:nth-child(2){animation-delay:.05s}#app.animate .kpis .kpi:nth-child(3){animation-delay:.1s}#app.animate .kpis .kpi:nth-child(4){animation-delay:.15s}#app.animate .kpis .kpi:nth-child(5){animation-delay:.2s}#app.animate .kpis .kpi:nth-child(6){animation-delay:.25s}
#app.animate .hb-f{transform-origin:left;animation:grow .95s cubic-bezier(.2,.8,.2,1) .15s both}

<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="transit" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* Connection settings.
   FASAL_API_BASE: '' means the API is on the same server as this page (the default).
   If the API lives elsewhere, put its address here, e.g. 'https://api.example.com'.
   FASAL_DEMO: true pre-fills the demo logins. Set it to false for a real launch. */
window.FASAL_API_BASE='';
window.FASAL_DEMO=true;
</script>
<script>
(function(){
'use strict';

/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dkey(d)};
const TODAY=addDays(0);
const fmtDate=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
const fmtTime=t=>t?new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
const num=n=>Number(n).toLocaleString('en-US');
const kg=n=>num(n)+' kg';
const rs=n=>'Rs '+num(Math.round(n));
const tons=k=>(k/1000).toFixed(1)+' t';
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):0;
const digits=s=>String(s||'').replace(/\D/g,'');
let seedv=20261001;
const rnd=()=>{seedv=(seedv*1664525+1013904223)%4294967296;return seedv/4294967296};
const ri=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];

/* ================= constants ================= */
const SLOTS=['8–9 am','9–10 am','10–11 am','11 am–12 pm','12–1 pm','1–2 pm','2–3 pm','3–4 pm'];
const SERVICE_MIN=10;
const GRADE={A:{factor:1,desc:'Clean, within limits'},B:{factor:.96,desc:'Minor defects'},C:{factor:.92,desc:'Below standard'}};
const STATUS={booked:['Booked','chip-info'],checked_in:['In queue','chip-wait'],inspection:['At inspection','chip-wait'],approved:['Approved','chip-ok'],unloaded:['Unloaded','chip-ok'],completed:['Completed','chip-done'],rejected:['Rejected','chip-bad'],cancelled:['Cancelled','chip-mute']};
const ROLES={
  farmer:{label:'Farmer',blurb:'Book a slot, get a token and follow your queue.'},
  staff:{label:'Centre staff',blurb:'Check in farmers, run the queue, weigh and receipt.'},
  inspector:{label:'Quality inspector',blurb:'Grade crops, record moisture, approve or reject.'},
  admin:{label:'Administrator',blurb:'Manage centres, capacity, reports and waiting times.'}
};

/* ================= state ================= */
const S={
  session:null,page:'intro',
  ui:{farmerTab:'home',staffTab:'bookings',inspTab:'pending',adminTab:'overview',loginRole:'farmer',loginMode:'signin',book:null,booked:null,selBooking:null,staffQ:'',staffStatus:'all',staffDate:TODAY,farmerQ:'',rep:null},
  farmers:[],centres:[],crops:[],bookings:[],staff:[],inspectors:[],admin:{name:'Sadia Perveen',title:'Regional manager'},
  counters:{bid:0,fid:0,cid:4}
};
const C=id=>S.centres.find(x=>x.id===id)||{name:'Unknown',code:'UNK',capacity:0};
const F=id=>S.farmers.find(x=>x.id===id)||{name:'Unknown',phone:'',village:''};
const K=id=>S.crops.find(x=>x.id===id)||{name:id,rate:0,maxMoist:14};
const slotCap=c=>Math.max(1,Math.ceil(c.capacity/8));
const slotLoad=(cid,date,slot)=>S.bookings.filter(b=>b.centreId===cid&&b.date===date&&b.slot===slot&&b.status!=='cancelled').length;
const dayLoad=(cid,date)=>S.bookings.filter(b=>b.centreId===cid&&b.date===date&&b.status!=='cancelled').length;
const queueOf=(cid,date)=>S.bookings.filter(b=>b.centreId===cid&&b.date===date&&b.status==='checked_in').sort((a,b)=>a.seq-b.seq);
const received=b=>b.net&&['approved','unloaded','completed'].includes(b.status);
const isActive=b=>!['completed','rejected','cancelled'].includes(b.status);

/* ================= API layer (talks to the Flask backend) ================= */
const API_BASE=String(window.FASAL_API_BASE||'').replace(/\/$/,'');
const DEMO=window.FASAL_DEMO===true;
let TOKEN=null;try{TOKEN=sessionStorage.getItem('ft_token')}catch(e){}
function setToken(t){TOKEN=t;try{t?sessionStorage.setItem('ft_token',t):sessionStorage.removeItem('ft_token')}catch(e){}}
async function api(path,method,body){
  let res;
  try{res=await fetch(API_BASE+'/api'+path,{method:method||'GET',headers:Object.assign({'Content-Type':'application/json'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){throw new Error('Cannot reach the server. Check your connection and try again.')}
  let data=null;try{data=await res.json()}catch(e){}
  if(res.status===401&&TOKEN){const m=(data&&data.error)||'Your session has expired. Please sign in again.';expireSession();toast(m);throw new Error(m)}
  if(!res.ok)throw new Error((data&&data.error)||('Request failed ('+res.status+')'));
  return data;
}
function expireSession(){setToken(null);S.session=null;S.me=null;S.page='login';render()}
async function loadState(){
  if(!TOKEN){
    const d=await api('/public/centres');
    S.centres=d.centres;S.crops=[];S.farmers=[];S.bookings=[];S.staff=[];S.inspectors=[];S.me=null;S.session=null;return;
  }
  const d=await api('/bootstrap');
  S.me=d.me;S.centres=d.centres;S.crops=d.crops;S.farmers=d.farmers;S.bookings=d.bookings;S.inspectors=d.inspectors;
  S.staff=d.role==='staff'?[d.me]:[];
  if(d.role==='admin')S.admin=d.me;
  S.session={role:d.role,userId:d.me.id};
}
/* run an API call, then reload the data and redraw. Returns the result, or undefined if it failed. */
async function act(fn,msg){
  if(S.busy)return;S.busy=true;
  try{
    const r=await fn();await loadState();render();
    if(msg)toast(typeof msg==='function'?msg(r):msg);
    return r;
  }catch(e){
    toast(e.message);
    try{await loadState();render()}catch(_){}
  }finally{S.busy=false}
}
async function startSession(r,page,tab){
  setToken(r.token);await loadState();
  S.page=page;if(tab)S.ui.farmerTab=tab;S.ui.booked=null;S.ui.book=null;render();window.scrollTo(0,0);
}

/* ================= shared view helpers ================= */

function timeline(b){
  const steps=[['Booked',b.createdAt],['Checked in',b.checkInAt],['Weighed',b.weighedAt],['Quality checked',b.quality&&b.quality.at],['Unloaded',b.unloadedAt],['Receipt and payment',b.completedAt]];
  const done={booked:1,checked_in:2,inspection:3,approved:4,unloaded:5,completed:6,rejected:4,cancelled:1}[b.status];
  return '<ol class="tl">'+steps.map((s,i)=>{
    let cls=i<done?'done':(i===done?'now':''),label=s[0];
    if(b.status==='rejected'){if(i===3){cls='bad';label='Rejected at quality check'}if(i>=4)cls='skip'}
    if(b.status==='cancelled'&&i>=1)cls='skip';
    return '<li class="'+cls+'" style="--k:'+i+'">'+label+(s[1]&&cls!=='skip'&&i<done?'<small>'+fmtTime(s[1])+'</small>':'')+'</li>';
  }).join('')+'</ol>';
}

}
function statusMsg(b){
  const q=queueOf(b.centreId,b.date),idx=q.findIndex(x=>x.id===b.id);
  switch(b.status){
    case 'booked': return ['Not checked in yet','Show this token to staff at the centre gate during your slot. They will add you to the queue. '+q.length+' '+(q.length===1?'farmer is':'farmers are')+' waiting at this centre now.'];
    case 'checked_in': return [idx===0?'You are next':'Position '+(idx+1)+' in the queue',idx===0?'Please go to the weighbridge when staff call your token.':idx+' '+(idx===1?'farmer is':'farmers are')+' ahead of you. Estimated wait is about '+idx*SERVICE_MIN+' minutes.'];
    case 'inspection': return ['Weighed, waiting for quality check','Net weight '+kg(b.net)+'. Your crop is assigned to inspector '+esc((S.inspectors.find(i=>i.id===b.inspectorId)||{name:'on duty'}).name)+'.'];
    case 'approved': return ['Quality approved, Grade '+b.quality.grade,'Proceed to the unloading bay. Staff will confirm once unloading is complete.'];
    case 'unloaded': return ['Unloading confirmed','Staff are completing your procurement record and payment.'];

    case 'rejected': return ['Produce rejected',esc(b.quality&&b.quality.remarks||'Did not meet quality limits.')];

  }
}

function bookState(){if(!S.ui.book)S.ui.book={crop:(S.crops.find(x=>x.active)||S.crops[0]||{}).id,qty:'',unit:'kg',centre:(S.centres.find(x=>x.open)||S.centres[0]||{}).id,date:TODAY,slot:null};return S.ui.book}
function slotPassed(date,i){const h=new Date().getHours();return date===TODAY&&(8+i+1)<=h}

function fBook(f){
  if(S.ui.booked){
    const b=S.bookings.find(x=>x.id===S.ui.booked);
    return '<div class="stack" style="max-width:640px"><div class="statusmsg"><strong>Booking confirmed</strong>Your digital token is ready. Show it to staff at the centre gate.</div>'+tokenCard(b)+'<div class="toolbar"><button class="btn btn-primary" data-act="track" data-id="'+b.id+'">Track queue status</button><button class="btn btn-ghost" data-act="bookAnother">Book another delivery</button></div></div>';
  }
  const bk=bookState(),c=C(bk.centre),k=K(bk.crop),q=bookQtyKg(bk);
  const days=[0,1,2,3,4,5,6].map(i=>addDays(i));

    const q=queueOf(c.id,TODAY),load=dayLoad(c.id,TODAY),pct=Math.min(100,Math.round(load/c.capacity*100)),cap=slotCap(c);
    const sl=SLOTS.map((s,i)=>({l:s.replace(' am','').replace(' pm','').replace('–','-'),v:slotLoad(c.id,TODAY,i)}));

/* ================= render ================= */
let tkTimer=null,lastKey='';
function observe(){
  const els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.12,rootMargin:'0px 0px -5% 0px'});
  els.forEach(e=>io.observe(e));
}
function render(){
  const ae=document.activeElement,fid=ae&&ae.id,pos=ae&&ae.selectionStart;
  const portal=['farmer','staff','inspector','admin'];
  if(portal.includes(S.page)&&!S.session)S.page='login';
  let h;
  switch(S.page){
    case 'login':h=loginPage();break;
    case 'farmer':h=portalHeader()+farmerView();break;
    case 'staff':h=portalHeader()+staffView();break;
    case 'inspector':h=portalHeader()+inspectorView();break;
    case 'admin':h=portalHeader()+adminView();break;
    case 'intro':h=intro();break;
    default:h=home();
  }
  const tabKey={farmer:S.ui.farmerTab+(S.ui.booked||''),staff:S.ui.staffTab,inspector:S.ui.inspTab,admin:S.ui.adminTab,login:S.ui.loginRole+S.ui.loginMode}[S.page]||'';
  const key=S.page+':'+tabKey,animate=key!==lastKey;lastKey=key;
  const app=$('#app');app.classList.toggle('animate',animate);
  app.innerHTML=h;
  observe();
  if(fid){const n=document.getElementById(fid);if(n&&n.focus){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos)}catch(e){}}}
  clearInterval(tkTimer);
  if(S.page==='home'&&$('#tkAhead')&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    let n=3;tkTimer=setInterval(()=>{
      if(!$('#tkAhead')){clearInterval(tkTimer);return}
      n=n===0?3:n-1;
      const ta=$('#tkAhead');ta.textContent=n===0?'Next':n;ta.classList.remove('tick');void ta.offsetWidth;ta.classList.add('tick');
      $('#tkLabel').textContent=n===0?'Your turn':(n===1?'farmer ahead':'farmers ahead');
      $('#tkEta').textContent=n===0?'Go to the weighbridge':'about '+n*SERVICE_MIN+' min';
      document.querySelectorAll('.t-dots .dot').forEach((d,i)=>d.classList.toggle('on',i<n));
    },2600);
  }
}

  void tr.offsetWidth;tr.classList.add('run');
  setTimeout(()=>{S.page='home';render();window.scrollTo(0,0);tr.classList.add('out')},1450);
  setTimeout(()=>{tr.hidden=true;tr.className='';tr.innerHTML='';S.visiting=false},2150);
};
H.go=d=>{S.page=d.page;if(d.role){S.ui.loginRole=d.role;S.ui.loginMode='signin'}render();window.scrollTo(0,0)};
H.anchor=d=>{const go=()=>{const el=document.getElementById(d.target);if(el)el.scrollIntoView({behavior:'smooth'})};if(S.page!=='home'){S.page='home';render();setTimeout(go,30)}else go()};
H.pickRole=d=>{S.ui.loginRole=d.role;S.ui.loginMode='signin';render()};
H.authMode=d=>{S.ui.loginMode=d.mode;render()};
H.tab=d=>{S.ui[d.group]=d.val;if(d.group==='farmerTab'&&d.val==='book')S.ui.booked=null;render();window.scrollTo(0,0)};
H.signout=async()=>{setToken(null);S.session=null;S.me=null;S.ui.booked=null;S.ui.book=null;S.ui.selBooking=null;S.ui.histAll=false;try{await loadState()}catch(e){}S.page='home';render();window.scrollTo(0,0)};
H.closeModal=()=>closeModal();
H.print=()=>{try{window.print()}catch(e){toast('Printing is not available here. Use your browser print option.')}};
H.refresh=()=>act(()=>Promise.resolve(),'Queue status updated');
H.histAll=()=>{S.ui.histAll=true;render()};
H.detail=d=>detailModal(need(d.id));
H.viewReceipt=d=>{closeModal();receiptModal(need(d.id))};

/* farmer */
H.track=d=>{S.ui.selBooking=d.id;S.ui.farmerTab='queue';S.ui.booked=null;render();window.scrollTo(0,0)};
H.cancelBooking=d=>act(()=>api('/bookings/'+d.id+'/cancel','POST'),r=>'Booking '+r.booking.token+' cancelled');
H.pickCentre=d=>{const bk=bookState();bk.centre=d.id;bk.slot=null;render()};
H.pickDate=d=>{const bk=bookState();bk.date=d.date;bk.slot=null;render()};
H.pickSlot=d=>{bookState().slot=+d.slot;render()};
H.bookAnother=()=>{S.ui.booked=null;S.ui.book=null;render()};
H.confirmBook=async()=>{
  const bk=bookState(),q=bookQtyKg(bk),c=C(bk.centre);
  if(!q)return toast('Enter the expected quantity of your crop.');
  if(q>30000)return toast('Quantity is too large for one booking. Split it into two bookings.');
  if(bk.slot==null)return toast('Choose a time slot.');
  if(slotLoad(bk.centre,bk.date,bk.slot)>=slotCap(c))return toast('That slot just filled up. Choose another.');
  if(S.busy)return;S.busy=true;
  try{
    const r=await api('/bookings','POST',{cropId:bk.crop,qty:q,centreId:bk.centre,date:bk.date,slot:bk.slot});
    await loadState();S.ui.booked=r.booking.id;S.ui.book=null;render();window.scrollTo(0,0);toast('Token '+r.booking.token+' issued');
  }catch(e){toast(e.message);try{await loadState();render()}catch(_){}}
  finally{S.busy=false}
};

/* staff */
H.checkIn=d=>{
  const b=need(d.id);
  if(b.date!==TODAY)return toast('Check-in opens on the booking date.');
  return act(()=>api('/bookings/'+d.id+'/check-in','POST'),r=>r.booking.token+' checked in and added to the queue');
};
H.openWeigh=d=>weighModal(need(d.id));
H.saveWeigh=async d=>{
  const g=parseFloat($('#wGross').value),t=parseFloat($('#wTare').value);
  if(!(g>0))return toast('Enter the gross weight.');
  if(!(t>=0))return toast('Enter the tare weight (use 0 if none).');
  if(g-t<=0)return toast('Gross weight must be more than tare weight.');
  const r=await act(()=>api('/bookings/'+d.id+'/weigh','POST',{gross:Math.round(g),tare:Math.round(t),visual:$('#wVisual').value,note:$('#wNote').value.trim()}),r=>r.booking.token+' weighed. Sent to the inspector.');
  if(r)closeModal();
};
H.qMove=d=>act(()=>api('/bookings/'+d.id+'/queue','POST',{action:+d.dir<0?'up':'down'}));
H.qFront=d=>act(()=>api('/bookings/'+d.id+'/queue','POST',{action:'front'}),r=>r.booking.token+' moved to the front');
H.qSkip=d=>act(()=>api('/bookings/'+d.id+'/queue','POST',{action:'end'}),r=>r.booking.token+' moved to the end');
H.unload=d=>act(()=>api('/bookings/'+d.id+'/unload','POST'),r=>'Unloading confirmed for '+r.booking.token);
H.complete=d=>act(()=>api('/bookings/'+d.id+'/complete','POST'),r=>'Procurement complete. Amount '+rs(r.booking.payment.amount));
H.genReceipt=async d=>{
  const b=need(d.id);
  if(b.receiptNo)return receiptModal(b);
  const r=await act(()=>api('/bookings/'+d.id+'/receipt','POST'),r=>'Receipt '+r.booking.receiptNo+' generated');
  if(r)receiptModal(need(d.id));
};

/* inspector */
H.openInspect=d=>inspectModal(need(d.id));
H.decide=async d=>{
  const gr=document.querySelector('input[name=iGrade]:checked'),m=parseFloat($('#iMoist').value),rem=$('#iRemarks').value.trim();
  if(!(m>=0))return toast('Enter the moisture percentage.');
  if(d.d==='reject'&&!rem)return toast('Add remarks explaining why the produce is rejected.');
  const r=await act(()=>api('/bookings/'+d.id+'/inspect','POST',{grade:gr?gr.value:'A',moisture:m,foreign:parseFloat($('#iForeign').value)||0,damaged:parseFloat($('#iDamaged').value)||0,remarks:rem,decision:d.d}),r=>r.booking.token+(d.d==='approve'?' approved':' rejected'));
  if(r)closeModal();
};

/* admin */
H.toggleFarmer=d=>{const f=F(d.id);return act(()=>api('/farmers/'+d.id,'PATCH',{status:f.status==='active'?'suspended':'active'}),r=>r.farmer.name+(r.farmer.status==='active'?' reactivated':' suspended'))};
H.saveCap=d=>{const v=parseInt($('#cap-'+d.id).value,10);if(!(v>=8&&v<=400))return toast('Capacity must be between 8 and 400 bookings.');return act(()=>api('/centres/'+d.id,'PATCH',{capacity:v}),'Capacity updated to '+v+' bookings per day')};
H.toggleCentre=d=>{const c=C(d.id);return act(()=>api('/centres/'+d.id,'PATCH',{open:!c.open}),r=>r.centre.name+(r.centre.open?' is open for bookings':' is closed for bookings'))};
H.saveCrop=d=>{const r=parseFloat($('#rate-'+d.id).value),m=parseFloat($('#moist-'+d.id).value);if(!(r>0)||!(m>0))return toast('Enter a valid rate and moisture limit.');return act(()=>api('/crops/'+d.id,'PATCH',{rate:r,maxMoist:m}),K(d.id).name+' updated')};
H.toggleCrop=d=>{const k=K(d.id);return act(()=>api('/crops/'+d.id,'PATCH',{active:!k.active}),k.name+(k.active?' is paused for new bookings':' is accepted again'))};

/* forms: errors from the server are shown in the red box at the top of the form */
const formCall=async(fn)=>{if(S.busy)return;S.busy=true;try{await fn()}catch(e){showErr(e.message)}finally{S.busy=false}};
FORMS.farmerIn=fd=>formCall(async()=>{
  const r=await api('/auth/farmer/login','POST',{phone:fd.get('phone'),password:fd.get('password')});
  await startSession(r,'farmer','home');
});
FORMS.farmerUp=fd=>formCall(async()=>{
  const name=String(fd.get('name')).trim(),ph=digits(fd.get('phone')),cn=digits(fd.get('cnic')),pw=String(fd.get('password'));
  if(name.length<3)throw new Error('Enter your full name.');
  if(!/^03\d{9}$/.test(ph))throw new Error('Enter an 11 digit mobile number starting with 03.');
  if(cn&&cn.length!==13)throw new Error('CNIC must be 13 digits, or leave it empty.');
  if(!String(fd.get('village')).trim())throw new Error('Enter your village or town.');
  if(pw.length<6)throw new Error('Password must be at least 6 characters.');
  const r=await api('/auth/farmer/register','POST',{name,phone:ph,cnic:cn,village:String(fd.get('village')).trim(),district:fd.get('district'),password:pw});
  await startSession(r,'farmer','book');toast('Account created. Book your first slot.');
});
FORMS.staffIn=fd=>formCall(async()=>{
  if(!String(fd.get('uid')).trim()||!String(fd.get('pw')))throw new Error('Enter your employee ID and password.');
  const r=await api('/auth/staff/login','POST',{empId:String(fd.get('uid')).trim(),password:String(fd.get('pw')),role:S.ui.loginRole});
  await startSession(r,r.role);
});
FORMS.addFarmer=fd=>formCall(async()=>{
  const name=String(fd.get('name')).trim(),ph=digits(fd.get('phone'));
  if(name.length<3)throw new Error('Enter the farmer\u2019s full name.');
  if(!/^03\d{9}$/.test(ph))throw new Error('Enter an 11 digit mobile number starting with 03.');
  await api('/farmers','POST',{name,phone:ph,village:String(fd.get('village')).trim()});
  await loadState();render();toast(name+' added');
});
FORMS.addCentre=fd=>formCall(async()=>{
  const name=String(fd.get('name')).trim(),cap=parseInt(fd.get('capacity'),10);
  if(name.length<3)throw new Error('Enter the centre name.');
  if(!(cap>=8&&cap<=400))throw new Error('Capacity must be between 8 and 400 bookings.');
  await api('/centres','POST',{name,district:String(fd.get('district')).trim(),capacity:cap});
  await loadState();render();toast(name+' added');
});
FORMS.addCrop=fd=>formCall(async()=>{
  const name=String(fd.get('name')).trim(),rate=parseFloat(fd.get('rate')),m=parseFloat(fd.get('moist'));
  if(name.length<2)throw new Error('Enter the crop name.');
  if(!(rate>0))throw new Error('Enter a sample rate in rupees per 40 kg.');
  if(!(m>0))throw new Error('Enter a moisture limit.');
  await api('/crops','POST',{name,rate,maxMoist:m});
  await loadState();render();toast(name+' added');
});

LIVE.qty=()=>{
  const bk=bookState(),q=bookQtyKg(bk),k=K(bk.crop);
  const h=$('#qtyHint');if(h)h.textContent=q?kg(q)+' ('+(q/40).toFixed(1)+' maunds)':'1 maund = 40 kg';
  const s=$('#sumQty');if(s)s.textContent=q?kg(q):'Not entered';
  const e=$('#sumEst');if(e)e.textContent=q?rs(q/40*k.rate):'Enter quantity';
};
LIVE.net=()=>{const g=parseFloat($('#wGross').value)||0,t=parseFloat($('#wTare').value)||0;$('#wNet').textContent=num(Math.max(0,g-t))+' kg'};
LIVE.moist=()=>{
  const i=$('#iMoist'),w=$('#moistWarn'),v=parseFloat(i.value),mx=parseFloat(i.dataset.max);
  if(v>mx){w.hidden=false;w.textContent='Moisture '+v+'% is above the '+mx+'% limit. Consider rejecting this load or noting it in the remarks.'}else w.hidden=true;
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.classList.contains('scrim')&&e.target!==t)return;
  const fn=H[t.dataset.act];if(fn){if(t.tagName==='A')e.preventDefault();fn(t.dataset,t,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const fn=FORMS[f.dataset.form];if(fn)fn(new FormData(f));
});
function setPath(p,v){const parts=p.split('.');let o=S.ui;while(parts.length>1){const k=parts.shift();o=o[k]=o[k]||{}}o[parts[0]]=v}
function onField(e){
  const t=e.target;
  if(t.dataset.onchange&&e.type==='change'){const fn=H[t.dataset.onchange];if(fn)fn(t.value);return}
  const textish=t.matches('input:not([type=radio]):not([type=checkbox]):not([type=date]),textarea');
  if(e.type==='input'&&!textish)return;
  if(e.type==='change'&&textish)return;
  if(t.dataset.bind){setPath(t.dataset.bind,t.type==='number'&&t.dataset.render===undefined?t.value:t.value);if(t.dataset.render!==undefined)render()}
  if(t.dataset.live&&LIVE[t.dataset.live])LIVE[t.dataset.live]();
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* start-up: load data from the server (restoring a saved sign-in if there is one) */
(async function boot(){
  try{await loadState()}
  catch(e){if(TOKEN){setToken(null);try{await loadState()}catch(e2){}}}
  S.page=S.session?S.session.role:'intro';
  render();
  if(!S.centres.length&&!S.session)toast('Cannot reach the server yet. Is the backend running?');
})();
/* keep the live queue fresh on the screens that show it (never on forms, so typing is not lost) */
const LIVE_TABS={farmer:['home','queue','history'],staff:['bookings','queue','unload','receipts'],inspector:['pending','done'],admin:['overview','queues']};
const tabNow=()=>({farmer:S.ui.farmerTab,staff:S.ui.staffTab,inspector:S.ui.inspTab,admin:S.ui.adminTab}[S.page]);
setInterval(()=>{
  if(!S.session||S.busy||document.hidden||!$('#modal').hidden)return;
  const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  if((LIVE_TABS[S.page]||[]).includes(tabNow()))loadState().then(render).catch(()=>{});
},15000);
})();
</script>
</body>
</html>
